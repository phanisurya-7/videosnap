<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | VideoSnap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            flex: 1;
        }

        .cart-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .cart-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .item-price {
            font-weight: 700;
            color: #818cf8;
        }

        .btn-checkout {
            background: var(--accent-gradient);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-checkout:hover {
            opacity: 0.9;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="brand">⚡ VideoSnap</a>
            <div class="nav-links">
                <a href="{% url 'products' %}" class="nav-link">Store</a>
                <a href="{% url 'cart' %}" class="nav-link" style="color: white;">Cart</a>
                <a href="{% url 'order' %}" class="nav-link">Orders</a>
                <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="cart-title">Your Cart</h1>
        
        {% if cart_items %}
            <div class="cart-list">
                {% for item in cart_items %}
                    <div class="cart-item">
                        <span class="item-name">{{ item.product.name }}</span>
                        <span class="item-price">${{ item.product.price }}</span>
                    </div>
                {% endfor %}
            </div>
            
            <a href="{% url 'checkout' %}" class="btn-checkout">Checkout</a>
        {% else %}
            <p style="color: var(--text-muted);">Your cart is currently empty.</p>
            <a href="{% url 'products' %}" class="btn-checkout" style="margin-top: 1rem;">Back to Store</a>
        {% endif %}
    </div>

    <footer>
        &copy; 2026 VideoSnap. All rights reserved.
    </footer>

</body>
</html>

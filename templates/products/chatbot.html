<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #6b2ba3;
        }

        .chatbox {
            width: 400px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .response {
            margin-bottom: 15px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="chatbox">

        <h2>VideoSnap Chatbot</h2>

        {% if response %}
        <div class="response">
            <b>Bot:</b>
            {{ response }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="message" placeholder="Ask something..." required>

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Successful | VideoSnap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .success-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .success-tick {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid #22c55e;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #22c55e;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .btn-link {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background: var(--accent-gradient);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-link:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-tick">✓</div>
        <h1>Checkout Successful!</h1>
        <p>Thank you for your purchase. Your order has been placed successfully.</p>
        
        <a href="{% url 'order' %}" class="btn-link">View My Orders</a>
        <a href="{% url 'products' %}" style="display: block; margin-top: 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Back to Store</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | VideoSnap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .order-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .item-status {
            font-size: 0.8rem;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .item-price {
            font-weight: 700;
            font-size: 1.15rem;
            color: #818cf8;
        }

        .btn-download {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-download:hover {
            background: rgba(99, 102, 241, 0.3);
            color: white;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="brand">⚡ VideoSnap</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">Store</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="order.html" class="nav-link active" style="color: white;">Orders</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="order-title">Your Orders</h1>
        
        <div id="orders-container" class="order-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <footer>
        &copy; 2026 VideoSnap. All rights reserved.
    </footer>

    <script>
        let orders = JSON.parse(localStorage.getItem('videosnap_orders') || '[]');
        if (orders.length === 0) {
            orders = [
                { name: 'Cinematic LUTs Pack', price: '29.99' }
            ];
            localStorage.setItem('videosnap_orders', JSON.stringify(orders));
        }

        const container = document.getElementById('orders-container');
        container.innerHTML = orders.map(order => `
            <div class="order-item">
                <div class="item-info">
                    <span class="item-name">${order.name}</span>
                    <span class="item-status">✓ Completed & Active License</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <span class="item-price">$${order.price}</span>
                    <button class="btn-download" onclick="alert('Downloading asset package for ${order.name}...')">Download Assets ↓</button>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>

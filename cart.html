<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | VideoSnap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            flex: 1;
            width: 100%;
        }

        .cart-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .cart-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .item-img {
            width: 70px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #1e293b;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .item-price {
            font-weight: 700;
            font-size: 1.15rem;
            color: #818cf8;
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            padding: 0.35rem 0.65rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.25);
            color: white;
        }

        .cart-summary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-checkout {
            background: var(--accent-gradient);
            color: white;
            padding: 0.85rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-checkout:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="brand">⚡ VideoSnap</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">Store</a>
                <a href="cart.html" class="nav-link active" style="color: white;">Cart</a>
                <a href="order.html" class="nav-link">Orders</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="cart-title">Your Cart</h1>
        
        <div id="cart-content">
            <!-- Rendered by JS -->
        </div>
    </div>

    <footer>
        &copy; 2026 VideoSnap. All rights reserved.
    </footer>

    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('videosnap_cart') || '[]');
            const container = document.getElementById('cart-content');

            if (cart.length === 0) {
                container.innerHTML = `
                    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1.5rem;">Your cart is currently empty.</p>
                    <a href="products.html" class="btn-checkout">Browse Store</a>
                `;
                return;
            }

            let subtotal = 0;
            const itemsHtml = cart.map((item, idx) => {
                subtotal += parseFloat(item.price);
                return `
                    <div class="cart-item">
                        <div class="item-left">
                            <img src="${item.img || 'media/products/luts_pack.png'}" alt="${item.name}" class="item-img">
                            <span class="item-name">${item.name}</span>
                        </div>
                        <div class="item-right">
                            <span class="item-price">$${item.price}</span>
                            <button class="btn-remove" onclick="removeItem(${idx})">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="cart-list">
                    ${itemsHtml}
                </div>
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>$${subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Digital Delivery</span>
                        <span style="color: #34d399;">Free (Instant)</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span>$${subtotal.toFixed(2)}</span>
                    </div>
                </div>
                <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
            `;
        }

        function removeItem(idx) {
            let cart = JSON.parse(localStorage.getItem('videosnap_cart') || '[]');
            cart.splice(idx, 1);
            localStorage.setItem('videosnap_cart', JSON.stringify(cart));
            renderCart();
        }

        function checkout() {
            let cart = JSON.parse(localStorage.getItem('videosnap_cart') || '[]');
            let orders = JSON.parse(localStorage.getItem('videosnap_orders') || '[]');
            orders = [...cart, ...orders];
            localStorage.setItem('videosnap_orders', JSON.stringify(orders));
            localStorage.removeItem('videosnap_cart');
            window.location.href = 'checkout.html';
        }

        renderCart();
    </script>
</body>
</html>
